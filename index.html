
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger Run</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  overflow:hidden;
  background:#263b24;
  font-family:Arial;
}
canvas {
  display:block;
  width:100vw;
  height:100vh;
  touch-action:none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,ground;
let score=0,best=0;
let speed=6;
let playing=false,over=false;
let obstacles=[];
let frame=0;

let tiger={
 x:70,y:0,w:95,h:58,
 vy:0,jumping:false
};

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
 ground=H*.80;
 tiger.y=ground-tiger.h;
}
window.addEventListener("resize",resize);
resize();

function drawTiger(){
 let x=tiger.x,y=tiger.y;

 // Tail
 ctx.strokeStyle="#d98225";
 ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(x+15,y+35);
 ctx.quadraticCurveTo(x-15,y+15,x-5,y+5);
 ctx.stroke();

 // Body
 ctx.fillStyle="#e98a2c";
 ctx.beginPath();
 ctx.ellipse(x+45,y+32,42,22,0,0,Math.PI*2);
 ctx.fill();

 // Black stripes
 ctx.strokeStyle="#171717";
 ctx.lineWidth=5;
 for(let i=0;i<5;i++){
  ctx.beginPath();
  ctx.moveTo(x+15+i*15,y+15);
  ctx.lineTo(x+23+i*15,y+43);
  ctx.stroke();
 }

 // Head
 ctx.fillStyle="#ed9a37";
 ctx.beginPath();
 ctx.arc(x+82,y+20,18,0,Math.PI*2);
 ctx.fill();

 // Ear
 ctx.beginPath();
 ctx.arc(x+72,y+5,7,0,Math.PI*2);
 ctx.fill();

 // Face
 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.arc(x+91,y+25,7,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";
 ctx.beginPath();
 ctx.arc(x+88,y+17,2,0,Math.PI*2);
 ctx.fill();

 // Legs
 ctx.strokeStyle="#d98225";
 ctx.lineWidth=10;
 ctx.beginPath();
 ctx.moveTo(x+30,y+47);
 ctx.lineTo(x+30,y+58);
 ctx.moveTo(x+65,y+47);
 ctx.lineTo(x+65,y+58);
 ctx.stroke();
}

function pole(o){
 ctx.fillStyle="#79451f";
 ctx.fillRect(o.x,ground-o.h,o.w,o.h);
 ctx.fillStyle="#b77a3d";
 ctx.fillRect(o.x+5,ground-o.h,o.w-10,o.h);
}

function jump(){
 if(!playing){
  playing=true;
  over=false;
  return;
 }
 if(!tiger.jumping){
  tiger.vy=-16;
  tiger.jumping=true;
 }
}

canvas.addEventListener("pointerdown",jump);

function reset(){
 score=0;
 speed=6;
 obstacles=[];
 tiger.y=ground-tiger.h;
 tiger.vy=0;
 tiger.jumping=false;
 frame=0;
 playing=true;
 over=false;
}

function update(){
 if(!playing || over) return;

 score++;
 speed=6+score/1000;

 tiger.vy+=0.8;
 tiger.y+=tiger.vy;

 if(tiger.y>=ground-tiger.h){
  tiger.y=ground-tiger.h;
  tiger.vy=0;
  tiger.jumping=false;
 }

 frame++;

 if(frame%95===0){
  obstacles.push({
   x:W,
   w:25,
   h:45+Math.random()*25
  });
 }

 obstacles.forEach(o=>o.x-=speed);
 obstacles=obstacles.filter(o=>o.x>-50);

 for(let o of obstacles){
  if(
   tiger.x+75>o.x &&
   tiger.x+20<o.x+o.w &&
   tiger.y+tiger.h>ground-o.h+5
  ){
   over=true;
   playing=false;
   best=Math.max(best,Math.floor(score/5));
   try{
    localStorage.setItem("tigerBest",best);
   }catch(e){}
  }
 }
}

function background(){
 ctx.fillStyle="#9cc5a0";
 ctx.fillRect(0,0,W,H);

 // Trees
 for(let i=0;i<8;i++){
  let x=(i*150-(frame*1.5)%150);
  ctx.fillStyle="#315d35";
  ctx.beginPath();
  ctx.arc(x+40,ground-100,45,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#543d24";
  ctx.fillRect(x+35,ground-100,10,100);
 }

 // Ground
 ctx.fillStyle="#725032";
 ctx.fillRect(0,ground,W,H-ground);
 ctx.fillStyle="#385c29";
 ctx.fillRect(0,ground-8,W,12);
}

function draw(){
 background();

 obstacles.forEach(pole);
 drawTiger();

 ctx.fillStyle="white";
 ctx.font="bold 25px Arial";
 ctx.fillText("SCORE: "+Math.floor(score/5),20,40);

 ctx.font="16px Arial";
 ctx.fillText("BEST: "+best,20,65);

 if(!playing && !over){
  ctx.textAlign="center";
  ctx.font="bold 32px Arial";
  ctx.fillText("TIGER RUN",W/2,H/2-35);
  ctx.font="18px Arial";
  ctx.fillText("TAP TO START",W/2,H/2+10);
  ctx.textAlign="left";
 }

 if(over){
  ctx.fillStyle="rgba(0,0,0,.65)";
  ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle="white";
  ctx.font="bold 32px Arial";
  ctx.fillText("GAME OVER",W/2,H/2-30);
  ctx.font="20px Arial";
  ctx.fillText("Score: "+Math.floor(score/5),W/2,H/2+10);
  ctx.fillText("TAP TO RESTART",W/2,H/2+50);
  ctx.textAlign="left";
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

try{
 best=Number(localStorage.getItem("tigerBest")||0);
}catch(e){}

loop();
</script>
</body>
</html>
